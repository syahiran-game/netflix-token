<!-- public/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Token Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; font-family: sans-serif; }
        .token-box { background-color: #1a1a1a; border: 1px solid #333; }
        .btn-red { background-color: #e50914; transition: 0.3s; }
        .btn-red:hover { background-color: #b20710; }
        .btn-gray { background-color: #2a2a2a; transition: 0.3s; }
        .btn-gray:hover { background-color: #3a3a3a; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 p-2 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            </div>
            <div>
                <h1 class="font-bold text-lg">Netflix Token</h1>
                <p class="text-gray-400 text-sm">Auto Generator</p>
            </div>
        </div>
    </div>

    <!-- Input Section -->
    <div class="token-box rounded-xl p-4 mb-4">
        <div class="flex justify-between items-center mb-4 bg-[#0f0f0f] p-3 rounded-lg border border-gray-800">
            <span class="text-gray-400">Jumlah:</span>
            <span id="countDisplay" class="font-bold">1</span>
            <span class="text-gray-500 text-sm">token</span>
        </div>
        <button id="generateBtn" class="btn-red w-full py-3 rounded-lg font-bold text-white flex justify-center items-center gap-2">
            Generate 1 Token
        </button>
    </div>

    <!-- Results Container -->
    <div id="resultsContainer" class="space-y-4">
        <!-- Token cards akan muncul di sini -->
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        let tokenCount = 0;

        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            generateBtn.innerHTML = 'Generating...';
            
            try {
                const response = await fetch('/api/generate-token.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert('Gagal: ' + data.error);
                } else {
                    tokenCount++;
                    renderTokenCard(data, tokenCount);
                }
            } catch (error) {
                alert('Ralat sistem: ' + error.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = 'Generate 1 Token';
            }
        });

        function renderTokenCard(token, index) {
            const expDate = token.expiry ? new Date(token.expiry).toLocaleString('id-ID') : '-';
            const plan = token.profile?.plan || 'Tidak diketahui';
            
            const card = document.createElement('div');
            card.className = 'token-box rounded-xl p-4 fade-in';
            card.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <span class="bg-red-900/30 text-red-500 px-2 py-1 rounded text-xs font-bold">#${index}</span>
                    <span class="text-gray-400 text-sm">Token Response</span>
                    <button onclick="this.closest('.token-box').remove()" class="text-gray-500 hover:text-red-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                
                <div class="mb-2 flex justify-between text-xs text-gray-400">
                    <span>🔑 Token</span>
                    <span class="cursor-pointer hover:text-white" onclick="copyToken('${token.token}')">Klik untuk menyalin</span>
                </div>
                
                <div class="bg-[#0f0f0f] p-3 rounded-lg border border-gray-800 mb-3 break-all text-sm font-mono text-gray-300">
                    ${token.token}
                </div>

                <div class="flex gap-4 text-xs text-gray-400 mb-4">
                    <span>📅 Exp: ${expDate}</span>
                    <span>Plan: ${plan}</span>
                </div>

                <div class="flex gap-2">
                    <button class="btn-red flex-1 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">
                        💻 Buka di PC
                    </button>
                    <button class="btn-gray flex-1 py-2 rounded-lg text-sm flex items-center justify-center gap-1 text-gray-300">
                        📱 Android
                    </button>
                    <button class="btn-gray flex-1 py-2 rounded-lg text-sm flex items-center justify-center gap-1 text-gray-300">
                        📺 TV
                    </button>
                </div>
            `;
            
            resultsContainer.prepend(card);
        }

        window.copyToken = function(tokenStr) {
            navigator.clipboard.writeText(tokenStr).then(() => {
                alert('Token berjaya disalin!');
            }).catch(err => {
                console.error('Gagal menyalin: ', err);
            });
        }
    </script>
</body>
  </html>
